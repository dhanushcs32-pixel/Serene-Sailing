plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    flatDir {
        dirs 'libs'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        // Force deterministic single-threaded mod loading. With parallel
        // loading enabled, cross-mod registry access during
        // GameData.postRegisterEvents can race against other mods'
        // registration threads and throw during startup.
        systemProperty 'neoforge.enableParallelModLoading', 'false'
        systemProperty 'fml.enableParallelModLoading', 'false'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// 'localRuntime' = present when testing in the IDE, but NOT force-pulled onto
// anyone who depends on this mod (they're expected to bring their own copy
// of Sable / Create / Aeronautics via the modpack, same as any other addon).
configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // --- Local Libraries (CoroUtil / NeoForge Jars) ---
    compileOnly fileTree(dir: 'libs', include: ['coroutil-*.jar'])
    localRuntime fileTree(dir: 'libs', include: ['coroutil-*.jar'])

    // --- Sable companion math API (Pose3dc / Pose3d / BoundingBox3d) ---
    // Shipped jar-in-jar inside Sable; exposed here compile-only (never
    // localRuntime - that would duplicate the jar-in-jar classes).
    compileOnly fileTree(dir: 'libs', include: ['sable-companion-*.jar'])
    // Veil: needed at compile time for Sable's ForceGroups RegistryObject fields.
    compileOnly fileTree(dir: 'libs', include: ['veil-neoforge-*.jar'])

    // --- Sable ---
    compileOnly "maven.modrinth:sable:${sable_version}"
    localRuntime "maven.modrinth:sable:${sable_version}"

    // --- Create ---
    compileOnly "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:create:${create_version}"

    // --- Create Aeronautics ---
    compileOnly "maven.modrinth:create-aeronautics:${create_aeronautics_version}"
    localRuntime "maven.modrinth:create-aeronautics:${create_aeronautics_version}"

    // --- Weather2 ---
    compileOnly "maven.modrinth:weather-storms-tornadoes:${weather2_version}"
    localRuntime "maven.modrinth:weather-storms-tornadoes:${weather2_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
test {
    useJUnitPlatform()
    classpath += configurations.localRuntime
    classpath += configurations.compileClasspath
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
